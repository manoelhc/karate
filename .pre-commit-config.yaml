minimum_pre_commit_version: '4.0.0'
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1, resolved 2026-11-04
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: rust-format
        name: Rust formatting (1.99.1)
        entry: ./scripts/cargo.sh fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
