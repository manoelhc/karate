name: Foundation checks (partial platform)
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - name: Make isolated PostgreSQL binaries available
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: make install-rust lint-rust test-rust build-rust
      - name: Install pinned license checker
        run: ./scripts/cargo.sh install cargo-deny --version 0.20.2 --locked
      - run: make licenses-rust
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Isolated PostgreSQL fixture
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          make test-db
  release-coverage:
    name: Strict per-component line and branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview
      - run: rustup toolchain install nightly-2026-11-04 --profile minimal --component llvm-tools-preview
      - name: Make isolated PostgreSQL binaries available
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: make install-rust coverage-rust

  web:
    name: React checks and real browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: make web-install web-lint web-test web-build web-licenses web-audit
      - name: Install pinned Playwright browser and OS prerequisites
        run: ./scripts/node.sh web/node_modules/.bin/playwright install --with-deps chromium
      - run: make install-rust web-e2e
